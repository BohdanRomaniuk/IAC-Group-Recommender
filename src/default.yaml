# Default configuration for IAC-Group-Recommender
# Override any field by passing --config path/to/your.yaml to main.py.
# Fields not listed here keep their defaults from config.py.

# Data
data_folder_path: ./data/MovieLens-Rand
saves_folder_path: data/saves
results_folder_path: data/results

# Recommendation system
history_length: 10
top_K_list: [5, 10, 15, 20]
rewards: [0, 1]

# Reinforcement learning
embedding_size: 64
action_size: 1

# Environment (NMF)
env_tol: 0.0001
env_max_iter: 1000
env_alpha: 0.001

# Actor-Critic network
actor_hidden_sizes: [256, 128]
critic_hidden_sizes: [256, 128]

# DDPG algorithm
tau: 0.005
gamma: 0.95

# Optimizer
batch_size: 128
buffer_size: 100000
num_episodes: 1000
num_steps: 100
num_updates_per_step: 2
warmup_steps: 500
embedding_weight_decay: 1.0e-6
actor_weight_decay: 1.0e-6
critic_weight_decay: 1.0e-6
embedding_learning_rate: 5.0e-4
actor_learning_rate: 1.0e-3
critic_learning_rate: 1.0e-3
eval_per_iter: 10

# OU noise
ou_mu: 0.0
ou_theta: 0.15
ou_sigma: 0.3
ou_epsilon: 1.0

# Entropy regularisation
entropy_coef: 0.05

# Reward shaping
reward_diversity_alpha: 0.5
reward_coverage_beta: 0.1

# Prioritized Experience Replay
per_alpha: 0.6
per_beta_start: 0.4
per_beta_frames: 100000

